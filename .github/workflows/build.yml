name: build
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check uploaded files
        shell: bash
        run: |
          ls -la
          for f in Cargo.toml README.txt make_compat.py src/main.rs; do
            if [ ! -f "$f" ]; then
              echo "::error::$f がリポジトリにありません。zipの中身を全部アップロードし直してください(make_compat.py はルート直下)"
              exit 1
            fi
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Download libmpv (dev package)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*' --dir mpvdev
          7z x mpvdev/*.7z -ompvdev/x -y
          ls -la mpvdev/x

      - name: Build
        shell: bash
        run: |
          export RUSTFLAGS="-L native=$(pwd -W)/mpvdev/x"
          cargo build --release --target x86_64-pc-windows-gnu

      # 古いWindows 10 / GPUドライバ無しのPCでも起動できるようにする後処理
      #  - vulkan-1.dll の代替DLLを作る
      #  - 古いWindowsに無いAPIを肩代わりする bnps.dll を作り、exeとlibmpvをそれに向ける
      - name: Make compatible package
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          which gcc && gcc --version | head -1
          python -m pip install pefile
          mkdir out
          python make_compat.py \
            --exe target/x86_64-pc-windows-gnu/release/blocknoise-player.exe \
            --dll mpvdev/x/libmpv-2.dll \
            --out out
          cp README.txt out/
          ls -la out out/unpatched

      # 自己診断(ウィンドウなしで起動 → 1秒のテスト映像をデコード)。失敗してもEXEは出力する
      - name: Self test (compat build)
        continue-on-error: true
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force t1 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory t1 | Out-Null
          Copy-Item out\*.exe, out\*.dll t1\
          $env:BNP_SELFTEST = "1"
          $p = Start-Process -FilePath "$PWD\t1\blocknoise-player.exe" -WorkingDirectory "$PWD\t1" -Wait -PassThru
          Write-Host "exit code = $($p.ExitCode)"
          if (Test-Path t1\selftest.txt) { Get-Content t1\selftest.txt } else { Write-Host "selftest.txt が作られませんでした(起動に失敗)" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Self test (unpatched build, for comparison)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:BNP_SELFTEST = "1"
          $p = Start-Process -FilePath "$PWD\out\unpatched\blocknoise-player.exe" -WorkingDirectory "$PWD\out\unpatched" -Wait -PassThru
          Write-Host "exit code = $($p.ExitCode)"
          if (Test-Path out\unpatched\selftest.txt) { Get-Content out\unpatched\selftest.txt; Remove-Item out\unpatched\selftest.txt }

      - uses: actions/upload-artifact@v4
        with:
          name: blocknoise-player
          path: out
