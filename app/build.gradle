plugins {
    id 'com.android.application'
}

android {
    namespace 'app.lightfiler'
    compileSdk 34

    defaultConfig {
        applicationId 'app.lightfiler'
        minSdk 19
        // 29: 旧来のファイルアクセス(File API)を維持しつつ Android 14/15 にもインストール可能
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 個人利用向け: デバッグ鍵で署名してそのままインストール可能にする
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
// 依存ライブラリなし(AndroidX不使用)
